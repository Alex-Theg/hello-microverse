# API Gateway Configuration
# This file defines the routing rules and service mappings for the API Gateway

gateway:
  name: "Hello Microverse API Gateway"
  version: "1.0.0"
  description: "API Gateway for Hello Microverse microservices platform"
  
  # Global configuration
  global:
    timeout: 30s
    retry_attempts: 3
    rate_limit:
      requests_per_minute: 1000
      burst_size: 100
    
  # Service discovery and routing
  services:
    greeter:
      url: "http://localhost:8081"
      health_check: "/healthz"
      timeout: 10s
      retry_attempts: 2
      routes:
        - path: "/api/greetings"
          methods: ["GET", "POST"]
          target: "/greetings"
        - path: "/api/greetings/*"
          methods: ["GET", "PUT", "DELETE"]
          target: "/greetings/*"
    
    identity:
      url: "http://localhost:8082"
      health_check: "/healthz"
      timeout: 15s
      retry_attempts: 2
      routes:
        - path: "/api/auth/login"
          methods: ["POST"]
          target: "/auth/login"
        - path: "/api/auth/register"
          methods: ["POST"]
          target: "/auth/register"
        - path: "/api/auth/logout"
          methods: ["POST"]
          target: "/auth/logout"
        - path: "/api/users/*"
          methods: ["GET", "PUT", "DELETE"]
          target: "/users/*"
          auth_required: true
    
    preferences:
      url: "http://localhost:8083"
      health_check: "/healthz"
      timeout: 10s
      retry_attempts: 2
      routes:
        - path: "/api/preferences"
          methods: ["GET"]
          target: "/preferences"
        - path: "/api/preferences/*"
          methods: ["GET", "PUT", "DELETE"]
          target: "/preferences/*"
          auth_required: true
    
    audit:
      url: "http://localhost:8084"
      health_check: "/healthz"
      timeout: 10s
      retry_attempts: 2
      routes:
        - path: "/api/audit/logs"
          methods: ["GET"]
          target: "/audit/logs"
          auth_required: true
        - path: "/api/audit/logs/*"
          methods: ["GET"]
          target: "/audit/logs/*"
          auth_required: true
        - path: "/api/audit/events"
          methods: ["POST"]
          target: "/audit/events"
          auth_required: true

  # Gateway-specific routes
  gateway_routes:
    - path: "/healthz"
      methods: ["GET"]
      handler: "health_check"
      description: "Gateway health check"
    
    - path: "/gateway/status"
      methods: ["GET"]
      handler: "status"
      description: "Gateway status and service information"
    
    - path: "/gateway/metrics"
      methods: ["GET"]
      handler: "metrics"
      description: "Gateway metrics and statistics"
      auth_required: true

  # CORS configuration
  cors:
    enabled: true
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:8080"
      - "https://hellomicroverse.com"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "Content-Type"
      - "Authorization"
      - "X-Requested-With"
    max_age: 86400

  # Authentication configuration
  auth:
    jwt:
      secret_key: "${JWT_SECRET_KEY}"
      issuer: "hello-microverse-gateway"
      audience: "hello-microverse-api"
      expiration: "1h"
      refresh_expiration: "7d"
    
    # Public routes that don't require authentication
    public_routes:
      - "/healthz"
      - "/gateway/status"
      - "/api/auth/login"
      - "/api/auth/register"
      - "/api/greetings"

  # Logging configuration
  logging:
    level: "info"
    format: "json"
    fields:
      - "timestamp"
      - "level"
      - "message"
      - "service"
      - "request_id"
      - "user_id"
      - "ip_address"
      - "user_agent"
      - "response_time"
      - "status_code"

  # Monitoring and observability
  monitoring:
    metrics:
      enabled: true
      endpoint: "/gateway/metrics"
      include_request_duration: true
      include_request_size: true
      include_response_size: true
    
    tracing:
      enabled: false
      service_name: "api-gateway"
      jaeger_endpoint: "http://localhost:14268/api/traces"

  # Circuit breaker configuration
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: 30s
    half_open_max_calls: 3

  # Load balancing
  load_balancing:
    strategy: "round_robin"
    health_check_interval: 30s
    unhealthy_threshold: 3
    healthy_threshold: 2
