openapi: 3.0.3
info:
  title: greeter API
  description: |
    Generated from C++ code annotations for greeter service
  version: 1.0.0
  contact:
    name: Hello Microverse Team
    email: support@hellomicroverse.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /greetings:
    GET:
      summary: Get general greeting
      description: Returns a general greeting message from the greeter service
      operationId: getGeneralGreeting
      tags:
        - Greetings
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
  /greetings/{id}:
    GET:
      summary: Get personalized greeting
      description: Returns a personalized greeting message for a specific user or entity
      operationId: getPersonalizedGreeting
      tags:
        - Greetings
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
  /healthz:
    GET:
      summary: Health check endpoint
      description: Returns the health status of the greeter service
      operationId: healthCheck
      tags:
        - Health
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: integer
          description: Error code
        service:
          type: string
          description: Service that generated the error
      required:
        - error
        - service
